---
features:
  - |
    Adds the optional ``state`` query parameter to the audit collection APIs:
    ``GET /v1/audits`` and ``GET /v1/audits/detail``. The parameter filters
    audits by the existing Watcher audit state values before pagination.
fixes:
  - |
    Audit collection ``next`` links now preserve active audit filters, including
    the new ``state`` filter. This allows API clients such as Horizon plugins to
    follow paginated filtered results without rebuilding query strings.
  - |
    Audit collection filters for ``goal`` and ``strategy`` now remain correlated
    to the same audit row when both filters are used together. This prevents
    extra audits from being returned for combined ``goal``, ``strategy``, and
    ``state`` queries.
  - |
    Creating a ``CONTINUOUS`` audit with ``force=True`` now returns
    ``400 Bad Request``. The ``force`` option remains available for existing
    non-continuous audit creation flows where the Watcher microversion contract
    allows it.
  - |
    Creating a ``CONTINUOUS`` audit with an invalid ``interval`` now returns
    ``400 Bad Request`` instead of an internal server error.
